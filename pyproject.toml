[project]
name = "job-agent-monolith"
version = "0.1.0"
description = "Asynchronous AI job application monolith"
requires-python = ">=3.10"
dependencies = [
  "asyncpg>=0.30.0",
  "celery>=5.4.0",
  "fastapi>=0.115.0",
  "playwright",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "redis",
  "sqlalchemy>=2.0.35",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "reportlab>=4.2.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
